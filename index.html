<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Proyeksi & Kalkulator Margin Harga</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-100 p-6">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const initialDatabase = [
            { tahun: "24/25", tingkat: "12 SMA", produk: "TWT 12 SMA 4P", kelompok: 1, harga: 11400000, kbm: 180, to: 15 },
            { tahun: "25/26", tingkat: "12 SMA", produk: "TWT 12 SMA 4P", kelompok: 1, harga: 13000000, kbm: 195, to: 18 },
            { tahun: "26/27", tingkat: "12 SMA", produk: "TWT 12 SMA 4P", kelompok: 1, harga: 13700000, kbm: 209, to: 20 },
            { tahun: "24/25", tingkat: "12 SMA", produk: "TWT 12 SMA 4P", kelompok: 2, harga: 10500000, kbm: 180, to: 15 },
            { tahun: "25/26", tingkat: "12 SMA", produk: "TWT 12 SMA 4P", kelompok: 2, harga: 12100000, kbm: 195, to: 18 },
            { tahun: "26/27", tingkat: "12 SMA", produk: "TWT 12 SMA 4P", kelompok: 2, harga: 12900000, kbm: 209, to: 20 },
        ];

        const initialCityDatabase = [
            { kota: "Jakarta", kelompok: 1, tarifKBM: 186713, tarifTO: 40000 },
            { kota: "Bandung", kelompok: 1, tarifKBM: 175000, tarifTO: 40000 },
            { kota: "Bekasi", kelompok: 2, tarifKBM: 160000, tarifTO: 35000 },
            { kota: "Bogor", kelompok: 2, tarifKBM: 155000, tarifTO: 35000 },
            { kota: "Semarang", kelompok: 3, tarifKBM: 140000, tarifTO: 30000 },
        ];

        function App() {
            const [db, setDb] = useState(initialDatabase);
            const [cityDb, setCityDb] = useState(initialCityDatabase);
            const [activeMenu, setActiveMenu] = useState("input");
            
            const [selectedProdComp, setSelectedProdComp] = useState("TWT 12 SMA 4P");
            const [draftProyeksi, setDraftProyeksi] = useState({});

            const [jumlahSiswa, setJumlahSiswa] = useState(15);
            const [diskonList, setDiskonList] = useState([
                { type: '%', value: 0 },
                { type: '%', value: 0 },
                { type: '%', value: 0 }
            ]);

            const [biayaSiswaTotal, setBiayaSiswaTotal] = useState(3008475);
            const [biayaTetapKelas, setBiayaTetapKelas] = useState(5738252);
            const [jumlahKonsultasi, setJumlahKonsultasi] = useState(2);

            // STATE UNTUK ADD-ONS BARU
            const [addons, setAddons] = useState({
                videoEkstra: { checked: false, count: 0 },
                videoSoal: { checked: false, count: 0 },
                videoTeori: { checked: false, count: 0 },
                mengawasTOBK: false,
                tst: false
            });

            const [kbmPrev, setKbmPrev] = useState(209);
            const [toPrev, setToPrev] = useState(20);
            const [kbmTarget, setKbmTarget] = useState(220);
            const [toTarget, setToTarget] = useState(22);

            const [persenKenaikan, setPersenKenaikan] = useState(5);

            const persenKenaikanKBM = kbmPrev > 0 ? (((kbmTarget - kbmPrev) / kbmPrev) * 100).toFixed(1) : 0;
            const persenKenaikanTO = toPrev > 0 ? (((toTarget - toPrev) / toPrev) * 100).toFixed(1) : 0;

            const formatRp = (angka) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(angka);

            const listTahunUnik = [...new Set(db.map(d => d.tahun))].sort();
            const latestTA = listTahunUnik.length > 0 ? listTahunUnik[listTahunUnik.length - 1] : "26/27";
            
            function getPrevOrNextTA(ta, direction) {
                const parts = ta.split('/');
                if (parts.length === 2) {
                    let y1 = parseInt(parts[0], 10);
                    let y2 = parseInt(parts[1], 10);
                    if (direction === 'next') { y1++; y2++; }
                    else { y1--; y2--; }
                    return `${String(y1).padStart(2, '0')}/${String(y2).padStart(2, '0')}`;
                }
                return ta;
            }
            const targetTA = getPrevOrNextTA(latestTA, 'next');

            const cleanYear = (rawYear) => {
                const str = String(rawYear).trim();
                const match = str.match(/(\d{2}\/\d{2})/);
                if (match) return match[1];
                const match4 = str.match(/20(\d{2})\/20(\d{2})/);
                if (match4) return `${match4[1]}/${match4[2]}`;
                return str;
            };

            const handleUploadProduk = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const dataBuffer = new Uint8Array(evt.target.result);
                        const workbook = XLSX.read(dataBuffer, { type: 'array' });
                        const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                        const jsonData = XLSX.utils.sheet_to_json(worksheet, { defval: "" });
                        if (jsonData.length === 0) { alert("File kosong!"); return; }

                        const formattedData = jsonData.map(row => ({
                            tahun: cleanYear(row.Tahun_Ajaran || row.tahun || row.TA || "26/27"),
                            tingkat: String(row.Tingkat_Kelas || row.tingkat || "12 SMA").trim(),
                            produk: String(row.Nama_Produk || row.produk || "Produk Utama").trim(),
                            kelompok: parseInt(row.Kelompok_Kota || row.kelompok || 1),
                            harga: parseInt(String(row.Harga || row.harga || 0).replace(/\D/g, '')) || 0,
                            kbm: parseInt(row.Jumlah_KBM || row.kbm || 209),
                            to: parseInt(row.Jumlah_TO || row.to || 20)
                        }));

                        setDb(formattedData);
                        const products = [...new Set(formattedData.map(d => d.produk))];
                        if (products.length > 0) setSelectedProdComp(products[0]);
                        alert(`Berhasil memuat ${formattedData.length} baris data produk!`);
                    } catch (error) { alert("Gagal membaca file Excel."); }
                };
                reader.readAsArrayBuffer(file);
            };

            const handleUploadKota = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const dataBuffer = new Uint8Array(evt.target.result);
                        const workbook = XLSX.read(dataBuffer, { type: 'array' });
                        const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                        const jsonData = XLSX.utils.sheet_to_json(worksheet, { defval: "" });
                        if (jsonData.length === 0) { alert("File kosong!"); return; }

                        const formattedCityData = jsonData.map(row => ({
                            kota: String(row.Nama_Kota || row.kota || "Kota Lain").trim(),
                            kelompok: parseInt(row.Kelompok_Kota || row.kelompok || 1),
                            tarifKBM: parseInt(String(row.Tarif_KBM || row.tarifKBM || 0).replace(/\D/g, '')) || 0,
                            tarifTO: parseInt(String(row.Tarif_TO || row.tarifTO || 0).replace(/\D/g, '')) || 0
                        }));
                        setCityDb(formattedCityData);
                        alert(`Berhasil memuat ${formattedCityData.length} data kota & honor pengajar.`);
                    } catch (error) { alert("Gagal membaca file Excel kota."); }
                };
                reader.readAsArrayBuffer(file);
            };

            const handleAutoGenerate = () => {
                const newDrafts = {};
                listKelompokUnik.forEach(kel => {
                    const found = db.find(d => d.produk === selectedProdComp && d.kelompok === kel && d.tahun === latestTA);
                    const baseHarga = found ? found.harga : 10000000;
                    newDrafts[kel] = Math.round(baseHarga * (1 + persenKenaikan / 100));
                });
                setDraftProyeksi(newDrafts);
                alert(`Proyeksi harga ${targetTA} berhasil digenerate naik ${persenKenaikan}% dari TA ${latestTA}!`);
            };

            const listProdukUnik = [...new Set(db.map(item => item.produk))];
            const listKelompokUnik = [...new Set(db.filter(d => d.produk === selectedProdComp).map(d => d.kelompok))].sort((a, b) => a - b);

            const getMaxTarifByKelompok = (kelompokId) => {
                const citiesInGroup = cityDb.filter(c => c.kelompok === kelompokId);
                if (citiesInGroup.length === 0) return { maxKBM: 186713, maxTO: 40000 };
                const maxKBM = Math.max(...citiesInGroup.map(c => c.tarifKBM));
                const maxTO = Math.max(...citiesInGroup.map(c => c.tarifTO));
                return { maxKBM, maxTO };
            };

            const calculateNettIncomePerSiswa = (baseHarga) => {
                let currentPrice = baseHarga;
                diskonList.forEach(disc => {
                    if (disc.value > 0) {
                        if (disc.type === '%') {
                            currentPrice = currentPrice * (1 - disc.value / 100);
                        } else {
                            currentPrice = currentPrice - disc.value;
                        }
                    }
                });
                return Math.max(0, currentPrice) * jumlahSiswa;
            };

            const getAddonsCost = (maxKBM) => {
                let addTotal = 0;
                if (addons.videoEkstra.checked) addTotal += (addons.videoEkstra.count * maxKBM);
                if (addons.videoSoal.checked) addTotal += (addons.videoSoal.count * maxKBM);
                if (addons.videoTeori.checked) addTotal += (addons.videoTeori.count * maxKBM);
                if (addons.mengawasTOBK) addTotal += (toTarget * maxKBM);
                if (addons.tst) addTotal += (kbmTarget * maxKBM);
                return addTotal;
            };

            const calculateFinancials = (hargaAcuan, maxKBM, maxTO) => {
                const nettIncome = calculateNettIncomePerSiswa(hargaAcuan);
                
                // Hitung Addons
                const addonsCost = getAddonsCost(maxKBM);

                // 1. Base Cost Dasar
                const biayaKonsultasi = maxKBM * 0.33 * jumlahKonsultasi;
                const baseCost = (biayaSiswaTotal * jumlahSiswa) + biayaTetapKelas + (kbmTarget * maxKBM) + (toTarget * maxTO) + biayaKonsultasi + addonsCost;

                // 2. Pajak Income 2% dari Nett Income
                const pajakIncome = nettIncome * 0.02;
                const costWithTax = baseCost + pajakIncome;

                // 3. Biaya Lain-lain 10% dari cost setelah pajak
                const biayaLainLain = costWithTax * 0.10;

                // 4. Total Cost Final
                const totalCostFinal = costWithTax + biayaLainLain;

                // 5. Laba Kotor (Gross Profit) sebelum pajak profit
                const grossProfit = nettIncome - totalCostFinal;

                // 6. Pajak Margin / Pajak Profit 25% (Hanya berlaku jika profit positif)
                const pajakProfit = grossProfit > 0 ? grossProfit * 0.25 : 0;

                // 7. Laba Bersih Akhir / Net Profit
                const netProfit = grossProfit - pajakProfit;

                // 8. Profit Margin Akhir (%)
                const profitMargin = nettIncome > 0 ? (netProfit / nettIncome) * 100 : 0;

                return {
                    nettIncome, pajakIncome, addonsCost, baseCost, biayaLainLain, totalCostFinal, grossProfit, pajakProfit, netProfit, profitMargin
                };
            };

            const handleExportComp = () => {
                const wb = XLSX.utils.book_new();

                const exportKelompok = listKelompokUnik.map(kel => {
                    const getVal = (ta) => {
                        const found = db.find(d => d.produk === selectedProdComp && d.kelompok === kel && d.tahun === ta);
                        return found ? found.harga : 0;
                    };
                    const tarif = getMaxTarifByKelompok(kel);
                    const hargaAcuan = draftProyeksi[kel] || getVal(latestTA) || 0;
                    const fin = calculateFinancials(hargaAcuan, tarif.maxKBM, tarif.maxTO);

                    let rowObj = { "Kelompok Kota": `Kelompok ${kel}`, "Produk": selectedProdComp };
                    listTahunUnik.forEach(ta => { rowObj[`TA ${ta}`] = getVal(ta); });
                    rowObj[`Proyeksi ${targetTA}`] = hargaAcuan;
                    rowObj["Nett Income"] = Math.round(fin.nettIncome);
                    rowObj["Add-ons Cost"] = Math.round(fin.addonsCost);
                    rowObj["Base Cost (Inc. Addons)"] = Math.round(fin.baseCost);
                    rowObj["Pajak Income (2%)"] = Math.round(fin.pajakIncome);
                    rowObj["Biaya Lain (10%)"] = Math.round(fin.biayaLainLain);
                    rowObj["Total Cost Final"] = Math.round(fin.totalCostFinal);
                    rowObj["Profit Sebelum Pajak"] = Math.round(fin.grossProfit);
                    rowObj["Pajak Profit (25%)"] = Math.round(fin.pajakProfit);
                    rowObj["Margin Bersih (Rp)"] = Math.round(fin.netProfit);
                    rowObj["Margin Akhir (%)"] = parseFloat(fin.profitMargin.toFixed(2));
                    return rowObj;
                });
                const ws1 = XLSX.utils.json_to_sheet(exportKelompok);
                XLSX.utils.book_append_sheet(wb, ws1, "Per Kelompok Kota");

                const exportDetailKota = cityDb.map(c => {
                    const foundProd = db.find(d => d.produk === selectedProdComp && d.kelompok === c.kelompok && d.tahun === latestTA);
                    const hargaAcuan = draftProyeksi[c.kelompok] || (foundProd ? foundProd.harga : 0);
                    const fin = calculateFinancials(hargaAcuan, c.tarifKBM, c.tarifTO);

                    return {
                        "Nama Kota": c.kota,
                        "Kelompok": c.kelompok,
                        "Produk": selectedProdComp,
                        "Harga Acuan": hargaAcuan,
                        "Tarif KBM Kota": c.tarifKBM,
                        "Tarif TO Kota": c.tarifTO,
                        "Nett Income": Math.round(fin.nettIncome),
                        "Add-ons Cost": Math.round(fin.addonsCost),
                        "Base Cost (Inc. Addons)": Math.round(fin.baseCost),
                        "Pajak Income (2%)": Math.round(fin.pajakIncome),
                        "Biaya Lain (10%)": Math.round(fin.biayaLainLain),
                        "Total Cost Final": Math.round(fin.totalCostFinal),
                        "Profit Sebelum Pajak": Math.round(fin.grossProfit),
                        "Pajak Profit (25%)": Math.round(fin.pajakProfit),
                        "Margin Bersih (Rp)": Math.round(fin.netProfit),
                        "Margin Akhir (%)": parseFloat(fin.profitMargin.toFixed(2))
                    };
                });
                const ws2 = XLSX.utils.json_to_sheet(exportDetailKota);
                XLSX.utils.book_append_sheet(wb, ws2, "Per Kota Detail");

                XLSX.writeFile(wb, `Komparasi_Margin_${selectedProdComp.replace(/\s+/g, '_')}.xlsx`);
            };

            const toggleAddon = (key) => {
                if (typeof addons[key] === 'boolean') {
                    setAddons({ ...addons, [key]: !addons[key] });
                } else {
                    setAddons({ ...addons, [key]: { ...addons[key], checked: !addons[key].checked } });
                }
            };

            const updateAddonCount = (key, value) => {
                setAddons({ ...addons, [key]: { ...addons[key], count: parseInt(value) || 0 } });
            };

            return (
                <div className="max-w-7xl mx-auto bg-white rounded-2xl shadow-md border border-gray-200 overflow-hidden">
                    <div className="bg-slate-900 text-white p-6 flex flex-col lg:flex-row justify-between items-center gap-6">
                        <div>
                            <h1 className="text-2xl font-bold">Aplikasi Proyeksi & Kalkulator Margin Harga</h1>
                            <p className="text-sm text-gray-400 mt-1">Sistem manajemen database harga, addons kelas, dan perhitungan pajak final</p>
                        </div>
                        <div className="flex flex-wrap bg-slate-800 p-2 rounded-xl border border-slate-700 gap-2">
                            <button onClick={() => setActiveMenu("input")} className={`px-4 py-2.5 rounded-lg text-xs font-bold transition-all ${activeMenu === 'input' ? 'bg-blue-600 text-white shadow-lg' : 'text-gray-300 hover:text-white'}`}>
                                📂 1. Database Produk
                            </button>
                            <button onClick={() => setActiveMenu("kota")} className={`px-4 py-2.5 rounded-lg text-xs font-bold transition-all ${activeMenu === 'kota' ? 'bg-blue-600 text-white shadow-lg' : 'text-gray-300 hover:text-white'}`}>
                                🏙 2. Database Kota & Honor
                            </button>
                            <button onClick={() => setActiveMenu("pembanding")} className={`px-4 py-2.5 rounded-lg text-xs font-bold transition-all ${activeMenu === 'pembanding' ? 'bg-emerald-600 text-white shadow-lg' : 'text-gray-300 hover:text-white'}`}>
                                📊 3. Kalkulator & Pembanding
                            </button>
                        </div>
                    </div>

                    <div className="p-8">
                        {activeMenu === 'input' ? (
                            <div className="space-y-6">
                                <div className="bg-blue-50 border border-blue-200 p-6 rounded-2xl flex flex-col md:flex-row justify-between items-center gap-4">
                                    <div>
                                        <h2 className="text-lg font-bold text-blue-900">Upload Database Harga Produk</h2>
                                    </div>
                                    <div className="flex flex-wrap gap-3">
                                        <label className="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-xl font-bold cursor-pointer shadow-md text-sm">
                                            📁 Upload Excel Produk
                                            <input type="file" accept=".xlsx, .xls, .csv" onChange={handleUploadProduk} className="hidden" />
                                        </label>
                                        {db.length > 0 && <button onClick={() => setDb([])} className="bg-red-50 text-red-600 border border-red-200 px-4 py-2.5 rounded-xl font-bold text-sm">🗑️ Reset</button>}
                                    </div>
                                </div>
                                <div className="bg-white border border-gray-200 rounded-2xl overflow-hidden shadow-sm max-h-[450px] overflow-y-auto">
                                    <table className="w-full text-left border-collapse text-sm">
                                        <thead className="bg-gray-100 text-gray-700 sticky top-0">
                                            <tr>
                                                <th className="p-3 border-b">TA</th>
                                                <th className="p-3 border-b">Kelas</th>
                                                <th className="p-3 border-b">Produk</th>
                                                <th className="p-3 border-b">Kelompok</th>
                                                <th className="p-3 border-b">Harga</th>
                                                <th className="p-3 border-b">KBM</th>
                                                <th className="p-3 border-b">TO</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {db.length === 0 ? <tr><td colSpan="7" className="p-6 text-center text-gray-400">Belum ada data produk.</td></tr> :
                                                db.map((item, idx) => (
                                                    <tr key={idx} className="border-b hover:bg-gray-50">
                                                        <td className="p-3 font-bold text-blue-600">{item.tahun}</td>
                                                        <td className="p-3 text-gray-600">{item.tingkat}</td>
                                                        <td className="p-3 text-gray-900 font-medium">{item.produk}</td>
                                                        <td className="p-3 text-gray-600">Kel. {item.kelompok}</td>
                                                        <td className="p-3 text-gray-900 font-bold">{formatRp(item.harga)}</td>
                                                        <td className="p-3 text-gray-600">{item.kbm} Sesi</td>
                                                        <td className="p-3 text-gray-600">{item.to} Kali</td>
                                                    </tr>
                                                ))
                                            }
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        ) : activeMenu === 'kota' ? (
                            <div className="space-y-6">
                                <div className="bg-emerald-50 border border-emerald-200 p-6 rounded-2xl flex flex-col md:flex-row justify-between items-center gap-4">
                                    <div>
                                        <h2 className="text-lg font-bold text-emerald-900">Database Kota & Honor Pengajar</h2>
                                    </div>
                                    <div className="flex flex-wrap gap-3">
                                        <label className="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-xl font-bold cursor-pointer shadow-md text-sm">
                                            📁 Upload Excel Kota
                                            <input type="file" accept=".xlsx, .xls, .csv" onChange={handleUploadKota} className="hidden" />
                                        </label>
                                        {cityDb.length > 0 && <button onClick={() => setCityDb([])} className="bg-red-50 text-red-600 border border-red-200 px-4 py-2.5 rounded-xl font-bold text-sm">🗑️ Reset Kota</button>}
                                    </div>
                                </div>
                                <div className="bg-white border border-gray-200 rounded-2xl overflow-hidden shadow-sm max-h-[450px] overflow-y-auto">
                                    <table className="w-full text-left border-collapse text-sm">
                                        <thead className="bg-gray-100 text-gray-700 sticky top-0">
                                            <tr>
                                                <th className="p-3 border-b">Nama Kota</th>
                                                <th className="p-3 border-b">Kelompok Kota</th>
                                                <th className="p-3 border-b">Tarif KBM per Sesi</th>
                                                <th className="p-3 border-b">Tarif TO per Sesi</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {cityDb.length === 0 ? <tr><td colSpan="4" className="p-6 text-center text-gray-400">Belum ada data kota.</td></tr> :
                                                cityDb.map((item, idx) => (
                                                    <tr key={idx} className="border-b hover:bg-gray-50">
                                                        <td className="p-3 font-bold text-slate-800">{item.kota}</td>
                                                        <td className="p-3 text-blue-600 font-semibold">Kelompok {item.kelompok}</td>
                                                        <td className="p-3 text-gray-900">{formatRp(item.tarifKBM)}</td>
                                                        <td className="p-3 text-gray-900">{formatRp(item.tarifTO)}</td>
                                                    </tr>
                                                ))
                                            }
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        ) : (
                            <div className="space-y-6">
                                <div className="flex flex-col md:flex-row justify-between items-center bg-slate-50 p-5 rounded-2xl border border-slate-200 gap-4">
                                    <div>
                                        <h2 className="text-lg font-bold text-slate-900">Dashboard Komparasi & Kalkulator Profit</h2>
                                    </div>
                                    <div className="flex items-center gap-3">
                                        <span className="text-sm font-semibold text-gray-700">Pilih Produk:</span>
                                        <select value={selectedProdComp} onChange={(e) => setSelectedProdComp(e.target.value)} className="bg-white border border-gray-300 rounded-xl px-4 py-2 font-medium shadow-sm outline-none text-sm">
                                            {listProdukUnik.map(p => <option key={p} value={p}>{p}</option>)}
                                        </select>
                                        <button onClick={handleExportComp} className="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl font-bold text-sm shadow-sm">📊 Export Dual-Format</button>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div className="bg-amber-50 border border-amber-200 p-5 rounded-2xl">
                                        <h3 className="text-sm font-bold text-amber-900 mb-4">📈 Volume & Target (TA {latestTA} $\rightarrow$ {targetTA})</h3>
                                        <div className="flex flex-wrap gap-4 text-xs">
                                            <div className="bg-white p-3 rounded-xl border border-amber-200 flex-1">
                                                <span className="block font-bold text-gray-600 mb-2">Sesi KBM (Naik {persenKenaikanKBM}%)</span>
                                                <div className="flex gap-2 items-center">
                                                    <input type="number" value={kbmPrev} onChange={(e) => setKbmPrev(parseInt(e.target.value) || 0)} className="w-16 px-2 py-1 border rounded text-center" /> $\rightarrow$
                                                    <input type="number" value={kbmTarget} onChange={(e) => setKbmTarget(parseInt(e.target.value) || 0)} className="w-16 px-2 py-1 border rounded bg-blue-50 font-bold text-center" />
                                                </div>
                                            </div>
                                            <div className="bg-white p-3 rounded-xl border border-amber-200 flex-1">
                                                <span className="block font-bold text-gray-600 mb-2">Sesi TO (Naik {persenKenaikanTO}%)</span>
                                                <div className="flex gap-2 items-center">
                                                    <input type="number" value={toPrev} onChange={(e) => setToPrev(parseInt(e.target.value) || 0)} className="w-16 px-2 py-1 border rounded text-center" /> $\rightarrow$
                                                    <input type="number" value={toTarget} onChange={(e) => setToTarget(parseInt(e.target.value) || 0)} className="w-16 px-2 py-1 border rounded bg-blue-50 font-bold text-center" />
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="bg-indigo-50 border border-indigo-100 p-5 rounded-2xl flex flex-col justify-center items-center gap-3">
                                        <span className="font-bold text-indigo-900 text-sm">⚡ Auto-Generate Harga Baru</span>
                                        <div className="flex items-center gap-2">
                                            <input type="number" value={persenKenaikan} onChange={(e) => setPersenKenaikan(parseFloat(e.target.value) || 0)} className="w-20 bg-white px-3 py-2 border border-indigo-200 rounded-xl text-center font-bold" />
                                            <span className="text-sm font-bold text-indigo-900">%</span>
                                            <button onClick={handleAutoGenerate} className="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-xl font-bold shadow-sm">
                                                Generate Semua
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-4 gap-4 bg-blue-50/60 p-5 rounded-2xl border border-blue-100">
                                    <div className="col-span-1">
                                        <label className="block text-sm font-bold text-blue-900 mb-2">👥 1. Siswa & Diskon</label>
                                        <input type="number" min="1" value={jumlahSiswa} onChange={(e) => setJumlahSiswa(parseInt(e.target.value) || 0)} className="w-full bg-white px-3 py-1.5 border border-blue-200 rounded-lg outline-none font-semibold mb-2" placeholder="Jml Siswa" />
                                        <div className="space-y-1">
                                            {diskonList.map((disc, idx) => (
                                                <div key={idx} className="flex gap-1">
                                                    <input type="number" placeholder={`Disc ${idx+1}`} value={disc.value || ''} onChange={(e) => {
                                                        const val = parseFloat(e.target.value) || 0;
                                                        const updated = [...diskonList]; updated[idx].value = val; setDiskonList(updated);
                                                    }} className="w-full bg-white px-2 py-1 border border-blue-200 rounded text-xs outline-none" />
                                                    <select value={disc.type} onChange={(e) => {
                                                        const updated = [...diskonList]; updated[idx].type = e.target.value; setDiskonList(updated);
                                                    }} className="bg-white border border-blue-200 rounded px-1 text-xs">
                                                        <option value="%">%</option><option value="Rp">Rp</option>
                                                    </select>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                    <div className="col-span-1">
                                        <label className="block text-sm font-bold text-blue-900 mb-2">💸 2. Cost Utama</label>
                                        <div className="space-y-2 text-xs">
                                            <div>
                                                <span className="text-blue-800 font-medium">Biaya Siswa:</span>
                                                <input type="text" value={formatRp(biayaSiswaTotal).replace('Rp', '').trim()} onChange={(e) => setBiayaSiswaTotal(parseInt(e.target.value.replace(/\D/g, '')) || 0)} className="w-full bg-white px-2 py-1 border border-blue-200 rounded outline-none" />
                                            </div>
                                            <div>
                                                <span className="text-blue-800 font-medium">Biaya Tetap:</span>
                                                <input type="text" value={formatRp(biayaTetapKelas).replace('Rp', '').trim()} onChange={(e) => setBiayaTetapKelas(parseInt(e.target.value.replace(/\D/g, '')) || 0)} className="w-full bg-white px-2 py-1 border border-blue-200 rounded outline-none" />
                                            </div>
                                            <div>
                                                <span className="text-blue-800 font-medium">Jumlah Konsul:</span>
                                                <input type="number" min="0" value={jumlahKonsultasi} onChange={(e) => setJumlahKonsultasi(parseInt(e.target.value) || 0)} className="w-full bg-white px-2 py-1 border border-blue-200 rounded outline-none font-bold" />
                                            </div>
                                        </div>
                                    </div>
                                    
                                    {/* PANEL BARU ADD-ONS */}
                                    <div className="col-span-2 bg-white/60 p-3 border border-blue-200 rounded-xl">
                                        <label className="block text-sm font-bold text-purple-900 mb-2">🧩 3. Opsi Tambahan (Add-ons Kelas)</label>
                                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-x-4 gap-y-2 text-xs">
                                            <div className="flex items-center gap-2">
                                                <input type="checkbox" checked={addons.videoEkstra.checked} onChange={() => toggleAddon('videoEkstra')} />
                                                <span className="w-20 font-medium text-gray-700">Video Ekstra</span>
                                                <input type="number" disabled={!addons.videoEkstra.checked} value={addons.videoEkstra.count} onChange={(e) => updateAddonCount('videoEkstra', e.target.value)} className={`w-12 border rounded px-1 text-center ${addons.videoEkstra.checked ? 'bg-white' : 'bg-gray-100'}`} />
                                            </div>
                                            <div className="flex items-center gap-2">
                                                <input type="checkbox" checked={addons.videoSoal.checked} onChange={() => toggleAddon('videoSoal')} />
                                                <span className="w-20 font-medium text-gray-700">Video Soal</span>
                                                <input type="number" disabled={!addons.videoSoal.checked} value={addons.videoSoal.count} onChange={(e) => updateAddonCount('videoSoal', e.target.value)} className={`w-12 border rounded px-1 text-center ${addons.videoSoal.checked ? 'bg-white' : 'bg-gray-100'}`} />
                                            </div>
                                            <div className="flex items-center gap-2">
                                                <input type="checkbox" checked={addons.videoTeori.checked} onChange={() => toggleAddon('videoTeori')} />
                                                <span className="w-20 font-medium text-gray-700">Video Teori</span>
                                                <input type="number" disabled={!addons.videoTeori.checked} value={addons.videoTeori.count} onChange={(e) => updateAddonCount('videoTeori', e.target.value)} className={`w-12 border rounded px-1 text-center ${addons.videoTeori.checked ? 'bg-white' : 'bg-gray-100'}`} />
                                            </div>
                                            <div className="flex items-center gap-2">
                                                <input type="checkbox" checked={addons.mengawasTOBK} onChange={() => toggleAddon('mengawasTOBK')} />
                                                <span className="font-medium text-gray-700">Mengawas TOBK <span className="text-[10px] text-gray-400">(=Sesi TO)</span></span>
                                            </div>
                                            <div className="flex items-center gap-2">
                                                <input type="checkbox" checked={addons.tst} onChange={() => toggleAddon('tst')} />
                                                <span className="font-medium text-gray-700">TST <span className="text-[10px] text-gray-400">(=Sesi KBM)</span></span>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div className="overflow-x-auto border border-gray-200 rounded-2xl shadow-sm">
                                    <table className="w-full text-left border-collapse text-sm">
                                        <thead className="bg-gray-100 text-gray-700">
                                            <tr>
                                                <th className="p-4 border-b">Kelompok Kota</th>
                                                <th className="p-4 border-b">TA Terakhir</th>
                                                <th className="p-4 border-b bg-blue-50 text-blue-900">Proyeksi TA {targetTA}</th>
                                                <th className="p-4 border-b bg-emerald-50 text-emerald-900">Nett Income</th>
                                                <th className="p-4 border-b bg-amber-50 text-amber-900">Total Cost Final</th>
                                                <th className="p-4 border-b bg-purple-50 text-purple-900">Margin Bersih Akhir (%)</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {listKelompokUnik.length === 0 ? <tr><td colSpan="6" className="p-6 text-center text-gray-400">Tidak ada data untuk produk ini.</td></tr> :
                                                listKelompokUnik.map((kel) => {
                                                    const getDataByTA = (ta) => db.find(d => d.produk === selectedProdComp && d.kelompok === kel && d.tahun === ta);
                                                    
                                                    const hargaAcuan = draftProyeksi[kel] || (getDataByTA(latestTA) ? getDataByTA(latestTA).harga : 0);
                                                    const maxTarif = getMaxTarifByKelompok(kel);
                                                    
                                                    const fin = calculateFinancials(hargaAcuan, maxTarif.maxKBM, maxTarif.maxTO);

                                                    return (
                                                        <tr key={kel} className="border-b hover:bg-gray-50">
                                                            <td className="p-4 font-bold text-gray-800">Kelompok {kel}</td>
                                                            <td className="p-4 text-gray-600 font-medium">{getDataByTA(latestTA) ? formatRp(getDataByTA(latestTA).harga) : '-'}</td>
                                                            <td className="p-4 bg-blue-50/50">
                                                                <input 
                                                                    type="text" 
                                                                    placeholder="Harga baru..." 
                                                                    value={draftProyeksi[kel] ? formatRp(draftProyeksi[kel]).replace('Rp', '').trim() : ''}
                                                                    onChange={(e) => {
                                                                        const val = parseInt(e.target.value.replace(/\D/g, ''), 10) || 0;
                                                                        setDraftProyeksi({...draftProyeksi, [kel]: val});
                                                                    }}
                                                                    className="w-full px-3 py-2 bg-white border border-gray-300 rounded-xl outline-none font-bold text-blue-900"
                                                                />
                                                            </td>
                                                            <td className="p-4 bg-emerald-50/40 font-bold text-emerald-700">{formatRp(fin.nettIncome)}</td>
                                                            <td className="p-4 bg-amber-50/40 font-semibold text-amber-700" title={`Base Cost: ${formatRp(fin.baseCost)} + Pajak 2%: ${formatRp(fin.pajakIncome)} -> + Lain 10%: ${formatRp(fin.biayaLainLain)}`}>
                                                                <div className="flex flex-col">
                                                                    <span>{formatRp(fin.totalCostFinal)}</span>
                                                                    {fin.addonsCost > 0 && <span className="text-[10px] text-amber-600">Inc. Addons: {formatRp(fin.addonsCost)}</span>}
                                                                </div>
                                                            </td>
                                                            <td className="p-4 bg-purple-50/40 font-bold text-purple-700" title={`Profit Kotor: ${formatRp(fin.grossProfit)} - Pajak 25%: ${formatRp(fin.pajakProfit)} = Margin Bersih: ${formatRp(fin.netProfit)}`}>
                                                                <div className="flex flex-col">
                                                                    <span className={`px-3 py-1.5 rounded-lg text-sm self-start mb-1 shadow-sm ${fin.profitMargin >= 20 ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}`}>
                                                                        {fin.profitMargin.toFixed(1)}%
                                                                    </span>
                                                                    <span className="text-[10px] text-purple-900 bg-white/60 px-1 rounded">Net: {formatRp(fin.netProfit)}</span>
                                                                </div>
                                                            </td>
                                                        </tr>
                                                    );
                                                })
                                            }
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
