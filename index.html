<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Proyeksi & Kalkulator Margin Harga</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-100 p-6">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const initialDatabase = [
            { tahun: "24/25", tingkat: "12 SMA", produk: "TWT 12 SMA 4P", kelompok: 1, harga: 11400000, kbm: 180, to: 15 },
            { tahun: "25/26", tingkat: "12 SMA", produk: "TWT 12 SMA 4P", kelompok: 1, harga: 13000000, kbm: 195, to: 18 },
            { tahun: "26/27", tingkat: "12 SMA", produk: "TWT 12 SMA 4P", kelompok: 1, harga: 13700000, kbm: 209, to: 20 },
            { tahun: "24/25", tingkat: "12 SMA", produk: "TWT 12 SMA 4P", kelompok: 2, harga: 10500000, kbm: 180, to: 15 },
            { tahun: "25/26", tingkat: "12 SMA", produk: "TWT 12 SMA 4P", kelompok: 2, harga: 12100000, kbm: 195, to: 18 },
            { tahun: "26/27", tingkat: "12 SMA", produk: "TWT 12 SMA 4P", kelompok: 2, harga: 12900000, kbm: 209, to: 20 },
        ];

        const initialCityDatabase = [
            { kota: "Jakarta", kelompok: 1, tarifKBM: 186713, tarifTO: 40000 },
            { kota: "Bandung", kelompok: 1, tarifKBM: 175000, tarifTO: 40000 },
            { kota: "Bekasi", kelompok: 2, tarifKBM: 160000, tarifTO: 35000 },
            { kota: "Bogor", kelompok: 2, tarifKBM: 155000, tarifTO: 35000 },
            { kota: "Semarang", kelompok: 3, tarifKBM: 140000, tarifTO: 30000 },
        ];

        function App() {
            const [db, setDb] = useState(initialDatabase);
            const [cityDb, setCityDb] = useState(initialCityDatabase);
            const [activeMenu, setActiveMenu] = useState("input"); // 'input' | 'kota' | 'pembanding'
            
            const [selectedProdComp, setSelectedProdComp] = useState("TWT 12 SMA 4P");
            const [draft27, setDraft27] = useState({});

            const [jumlahSiswa, setJumlahSiswa] = useState(15);
            const [diskonList, setDiskonList] = useState([
                { type: '%', value: 0 },
                { type: '%', value: 0 },
                { type: '%', value: 0 }
            ]);

            const [biayaSiswaTotal, setBiayaSiswaTotal] = useState(3008475);
            const [biayaTetapKelas, setBiayaTetapKelas] = useState(5738252);
            const [customKBM, setCustomKBM] = useState(209);
            const [customTO, setCustomTO] = useState(20);
            const [persenKenaikan, setPersenKenaikan] = useState(5);

            const formatRp = (angka) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(angka);

            const handleDownloadTemplateProduk = () => {
                const templateData = [{ Tahun_Ajaran: "26/27", Tingkat_Kelas: "12 SMA", Nama_Produk: "TWT 12 SMA 4P", Kelompok_Kota: 1, Harga: 13700000, Jumlah_KBM: 209, Jumlah_TO: 20 }];
                const ws = XLSX.utils.json_to_sheet(templateData);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "TemplateProduk");
                XLSX.writeFile(wb, "template_database_produk.xlsx");
            };

            const handleDownloadTemplateKota = () => {
                const templateData = [{ Nama_Kota: "Jakarta", Kelompok_Kota: 1, Tarif_KBM: 186713, Tarif_TO: 40000 }];
                const ws = XLSX.utils.json_to_sheet(templateData);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "TemplateKota");
                XLSX.writeFile(wb, "template_database_kota_pengajar.xlsx");
            };

            const handleUploadProduk = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const dataBuffer = new Uint8Array(evt.target.result);
                        const workbook = XLSX.read(dataBuffer, { type: 'array' });
                        const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                        const jsonData = XLSX.utils.sheet_to_json(worksheet, { defval: "" });
                        if (jsonData.length === 0) { alert("File kosong!"); return; }

                        const formattedData = jsonData.map(row => ({
                            tahun: String(row.Tahun_Ajaran || row.tahun || "26/27").trim(),
                            tingkat: String(row.Tingkat_Kelas || row.tingkat || "12 SMA").trim(),
                            produk: String(row.Nama_Produk || row.produk || "Produk Utama").trim(),
                            kelompok: parseInt(row.Kelompok_Kota || row.kelompok || 1),
                            harga: parseInt(String(row.Harga || row.harga || 0).replace(/\D/g, '')) || 0,
                            kbm: parseInt(row.Jumlah_KBM || row.kbm || 209),
                            to: parseInt(row.Jumlah_TO || row.to || 20)
                        }));
                        setDb(formattedData);
                        alert(`Berhasil memuat ${formattedData.length} baris data produk.`);
                    } catch (error) { alert("Gagal membaca file Excel."); }
                };
                reader.readAsArrayBuffer(file);
            };

            const handleUploadKota = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const dataBuffer = new Uint8Array(evt.target.result);
                        const workbook = XLSX.read(dataBuffer, { type: 'array' });
                        const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                        const jsonData = XLSX.utils.sheet_to_json(worksheet, { defval: "" });
                        if (jsonData.length === 0) { alert("File kosong!"); return; }

                        const formattedCityData = jsonData.map(row => ({
                            kota: String(row.Nama_Kota || row.kota || "Kota Lain").trim(),
                            kelompok: parseInt(row.Kelompok_Kota || row.kelompok || 1),
                            tarifKBM: parseInt(String(row.Tarif_KBM || row.tarifKBM || 0).replace(/\D/g, '')) || 0,
                            tarifTO: parseInt(String(row.Tarif_TO || row.tarifTO || 0).replace(/\D/g, '')) || 0
                        }));
                        setCityDb(formattedCityData);
                        alert(`Berhasil memuat ${formattedCityData.length} data kota & honor pengajar.`);
                    } catch (error) { alert("Gagal membaca file Excel kota."); }
                };
                reader.readAsArrayBuffer(file);
            };

            const handleAutoGenerate = () => {
                const newDrafts = {};
                listKelompokUnik.forEach(kel => {
                    const found = db.find(d => d.produk === selectedProdComp && d.kelompok === kel && d.tahun === "26/27");
                    const baseHarga = found ? found.harga : 10000000;
                    newDrafts[kel] = Math.round(baseHarga * (1 + persenKenaikan / 100));
                });
                setDraft27(newDrafts);
                alert(`Proyeksi harga berhasil digenerate naik ${persenKenaikan}%!`);
            };

            const listProdukUnik = [...new Set(db.map(item => item.produk))];
            const listKelompokUnik = [...new Set(db.filter(d => d.produk === selectedProdComp).map(d => d.kelompok))].sort((a, b) => a - b);

            const getMaxTarifByKelompok = (kelompokId) => {
                const citiesInGroup = cityDb.filter(c => c.kelompok === kelompokId);
                if (citiesInGroup.length === 0) return { maxKBM: 186713, maxTO: 40000 };
                const maxKBM = Math.max(...citiesInGroup.map(c => c.tarifKBM));
                const maxTO = Math.max(...citiesInGroup.map(c => c.tarifTO));
                return { maxKBM, maxTO };
            };

            const handleExportComp = () => {
                const exportData = listKelompokUnik.map(kel => {
                    const getVal = (ta) => {
                        const found = db.find(d => d.produk === selectedProdComp && d.kelompok === kel && d.tahun === ta);
                        return found ? found.harga : 0;
                    };
                    const tarif = getMaxTarifByKelompok(kel);
                    return {
                        "Kelompok Kota": `Kelompok ${kel}`,
                        "Produk": selectedProdComp,
                        "TA 24/25": getVal("24/25"),
                        "TA 25/26": getVal("25/26"),
                        "TA 26/27": getVal("26/27"),
                        "Proyeksi TA 27/28": draft27[kel] || 0,
                        "Max Tarif KBM": tarif.maxKBM,
                        "Max Tarif TO": tarif.maxTO
                    };
                });
                const ws = XLSX.utils.json_to_sheet(exportData);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "KomparasiMargin");
                XLSX.writeFile(wb, `Komparasi_${selectedProdComp.replace(/\s+/g, '_')}.xlsx`);
            };

            return (
                <div className="max-w-7xl mx-auto bg-white rounded-2xl shadow-md border border-gray-200 overflow-hidden">
                    {/* HEADER & NAVIGASI 3 TAB (Dibuat Lebih Luas & Responsif) */}
                    <div className="bg-slate-900 text-white p-6 flex flex-col lg:flex-row justify-between items-center gap-6">
                        <div>
                            <h1 className="text-2xl font-bold">Aplikasi Proyeksi & Kalkulator Margin Harga</h1>
                            <p className="text-sm text-gray-400 mt-1">Sistem manajemen database harga, honor pengajar, dan simulasi profitabilitas</p>
                        </div>
                        <div className="flex flex-wrap bg-slate-800 p-2 rounded-xl border border-slate-700 gap-2">
                            <button onClick={() => setActiveMenu("input")} className={`px-4 py-2.5 rounded-lg text-xs font-bold transition-all ${activeMenu === 'input' ? 'bg-blue-600 text-white shadow-lg' : 'text-gray-300 hover:text-white'}`}>
                                📂 1. Database Produk
                            </button>
                            <button onClick={() => setActiveMenu("kota")} className={`px-4 py-2.5 rounded-lg text-xs font-bold transition-all ${activeMenu === 'kota' ? 'bg-blue-600 text-white shadow-lg' : 'text-gray-300 hover:text-white'}`}>
                                🏙️ 2. Database Kota & Honor
                            </button>
                            <button onClick={() => setActiveMenu("pembanding")} className={`px-4 py-2.5 rounded-lg text-xs font-bold transition-all ${activeMenu === 'pembanding' ? 'bg-emerald-600 text-white shadow-lg' : 'text-gray-300 hover:text-white'}`}>
                                📊 3. Kalkulator & Pembanding
                            </button>
                        </div>
                    </div>

                    <div className="p-8">
                        {activeMenu === 'input' ? (
                            <div className="space-y-6">
                                <div className="bg-blue-50 border border-blue-200 p-6 rounded-2xl flex flex-col md:flex-row justify-between items-center gap-4">
                                    <div>
                                        <h2 className="text-lg font-bold text-blue-900">Upload Database Harga Produk</h2>
                                        <p className="text-sm text-blue-700 mt-1">Kelola data harga, volume KBM, dan TO per tahun ajaran.</p>
                                    </div>
                                    <div className="flex flex-wrap gap-3">
                                        <button onClick={handleDownloadTemplateProduk} className="bg-white border border-blue-300 text-blue-700 px-4 py-2.5 rounded-xl font-bold text-sm shadow-sm">📥 Download Template</button>
                                        <label className="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-xl font-bold cursor-pointer shadow-md text-sm">
                                            📁 Upload Excel
                                            <input type="file" accept=".xlsx, .xls, .csv" onChange={handleUploadProduk} className="hidden" />
                                        </label>
                                        {db.length > 0 && <button onClick={() => setDb([])} className="bg-red-50 text-red-600 border border-red-200 px-4 py-2.5 rounded-xl font-bold text-sm">🗑️ Reset</button>}
                                    </div>
                                </div>
                                <div className="bg-white border border-gray-200 rounded-2xl overflow-hidden shadow-sm max-h-[450px] overflow-y-auto">
                                    <table className="w-full text-left border-collapse text-sm">
                                        <thead className="bg-gray-100 text-gray-700 sticky top-0">
                                            <tr>
                                                <th className="p-3 border-b">TA</th>
                                                <th className="p-3 border-b">Kelas</th>
                                                <th className="p-3 border-b">Produk</th>
                                                <th className="p-3 border-b">Kelompok</th>
                                                <th className="p-3 border-b">Harga</th>
                                                <th className="p-3 border-b">KBM</th>
                                                <th className="p-3 border-b">TO</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {db.length === 0 ? <tr><td colSpan="7" className="p-6 text-center text-gray-400">Belum ada data produk.</td></tr> :
                                                db.map((item, idx) => (
                                                    <tr key={idx} className="border-b hover:bg-gray-50">
                                                        <td className="p-3 font-bold text-blue-600">{item.tahun}</td>
                                                        <td className="p-3 text-gray-600">{item.tingkat}</td>
                                                        <td className="p-3 text-gray-900 font-medium">{item.produk}</td>
                                                        <td className="p-3 text-gray-600">Kel. {item.kelompok}</td>
                                                        <td className="p-3 text-gray-900 font-bold">{formatRp(item.harga)}</td>
                                                        <td className="p-3 text-gray-600">{item.kbm} Sesi</td>
                                                        <td className="p-3 text-gray-600">{item.to} Kali</td>
                                                    </tr>
                                                ))
                                            }
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        ) : activeMenu === 'kota' ? (
                            <div className="space-y-6">
                                <div className="bg-emerald-50 border border-emerald-200 p-6 rounded-2xl flex flex-col md:flex-row justify-between items-center gap-4">
                                    <div>
                                        <h2 className="text-lg font-bold text-emerald-900">Database Kota & Honor Pengajar</h2>
                                        <p className="text-sm text-emerald-700 mt-1">Sistem otomatis mengambil tarif <strong>tertinggi</strong> dari setiap kelompok kota untuk simulasi cost.</p>
                                    </div>
                                    <div className="flex flex-wrap gap-3">
                                        <button onClick={handleDownloadTemplateKota} className="bg-white border border-emerald-300 text-emerald-700 px-4 py-2.5 rounded-xl font-bold text-sm shadow-sm">📥 Download Template Kota</button>
                                        <label className="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-xl font-bold cursor-pointer shadow-md text-sm">
                                            📁 Upload Excel Kota
                                            <input type="file" accept=".xlsx, .xls, .csv" onChange={handleUploadKota} className="hidden" />
                                        </label>
                                        {cityDb.length > 0 && <button onClick={() => setCityDb([])} className="bg-red-50 text-red-600 border border-red-200 px-4 py-2.5 rounded-xl font-bold text-sm">🗑️ Reset Kota</button>}
                                    </div>
                                </div>
                                <div className="bg-white border border-gray-200 rounded-2xl overflow-hidden shadow-sm max-h-[450px] overflow-y-auto">
                                    <table className="w-full text-left border-collapse text-sm">
                                        <thead className="bg-gray-100 text-gray-700 sticky top-0">
                                            <tr>
                                                <th className="p-3 border-b">Nama Kota</th>
                                                <th className="p-3 border-b">Kelompok Kota</th>
                                                <th className="p-3 border-b">Tarif KBM per Sesi</th>
                                                <th className="p-3 border-b">Tarif TO per Sesi</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {cityDb.length === 0 ? <tr><td colSpan="4" className="p-6 text-center text-gray-400">Belum ada data kota.</td></tr> :
                                                cityDb.map((item, idx) => (
                                                    <tr key={idx} className="border-b hover:bg-gray-50">
                                                        <td className="p-3 font-bold text-slate-800">{item.kota}</td>
                                                        <td className="p-3 text-blue-600 font-semibold">Kelompok {item.kelompok}</td>
                                                        <td className="p-3 text-gray-900">{formatRp(item.tarifKBM)}</td>
                                                        <td className="p-3 text-gray-900">{formatRp(item.tarifTO)}</td>
                                                    </tr>
                                                ))
                                            }
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        ) : (
                            <div className="space-y-8">
                                <div className="flex flex-col md:flex-row justify-between items-center bg-slate-50 p-5 rounded-2xl border border-slate-200 gap-4">
                                    <div>
                                        <h2 className="text-lg font-bold text-slate-900">Dashboard Komparasi & Kalkulator Profit</h2>
                                        <p className="text-sm text-slate-600">Cost KBM & TO otomatis menggunakan tarif tertinggi dari database kota.</p>
                                    </div>
                                    <div className="flex items-center gap-3">
                                        <span className="text-sm font-semibold text-gray-700">Pilih Produk:</span>
                                        <select value={selectedProdComp} onChange={(e) => setSelectedProdComp(e.target.value)} className="bg-white border border-gray-300 rounded-xl px-4 py-2 font-medium shadow-sm outline-none text-sm">
                                            {listProdukUnik.map(p => <option key={p} value={p}>{p}</option>)}
                                        </select>
                                        <button onClick={handleExportComp} className="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl font-bold text-sm shadow-sm">📊 Export</button>
                                    </div>
                                </div>

                                <div className="bg-indigo-50 border border-indigo-100 p-4 rounded-2xl flex flex-col md:flex-row justify-between items-center gap-4">
                                    <div className="text-sm text-indigo-900">
                                        <span className="font-bold">⚡ Auto-Generate Harga:</span> Naikkan seluruh harga proyeksi secara massal berdasarkan persentase.
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <input type="number" value={persenKenaikan} onChange={(e) => setPersenKenaikan(parseFloat(e.target.value) || 0)} className="w-20 bg-white px-3 py-1.5 border border-indigo-200 rounded-xl text-sm text-center font-bold" />
                                        <span className="text-sm font-bold text-indigo-900">%</span>
                                        <button onClick={handleAutoGenerate} className="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl font-bold text-sm shadow-sm">
                                            🚀 Generate Semua Harga
                                        </button>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6 bg-blue-50/60 p-6 rounded-2xl border border-blue-100">
                                    <div>
                                        <label className="block text-sm font-bold text-blue-900 mb-2">👥 1. Jumlah Siswa per Kelas</label>
                                        <input type="number" min="1" value={jumlahSiswa} onChange={(e) => setJumlahSiswa(parseInt(e.target.value) || 0)} className="w-full bg-white px-4 py-2 border border-blue-200 rounded-xl outline-none font-semibold" />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-bold text-blue-900 mb-2">🏷️ 2. Diskon (Max 3 Lapis)</label>
                                        <div className="space-y-2">
                                            {diskonList.map((disc, idx) => (
                                                <div key={idx} className="flex gap-2">
                                                    <input type="number" placeholder={`Diskon ${idx+1}`} value={disc.value || ''} onChange={(e) => {
                                                        const val = parseFloat(e.target.value) || 0;
                                                        const updated = [...diskonList]; updated[idx].value = val; setDiskonList(updated);
                                                    }} className="w-full bg-white px-3 py-1.5 border border-blue-200 rounded-lg text-sm outline-none" />
                                                    <select value={disc.type} onChange={(e) => {
                                                        const updated = [...diskonList]; updated[idx].type = e.target.value; setDiskonList(updated);
                                                    }} className="bg-white border border-blue-200 rounded-lg px-2 text-sm">
                                                        <option value="%">%</option><option value="Rp">Rp</option>
                                                    </select>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-bold text-blue-900 mb-2">💸 3. Rincian Cost (Biaya)</label>
                                        <div className="space-y-2 text-sm">
                                            <div>
                                                <span className="text-xs text-blue-800 block font-medium">Biaya per Siswa:</span>
                                                <input type="text" value={formatRp(biayaSiswaTotal).replace('Rp', '').trim()} onChange={(e) => setBiayaSiswaTotal(parseInt(e.target.value.replace(/\D/g, '')) || 0)} className="w-full bg-white px-3 py-1.5 border border-blue-200 rounded-lg outline-none text-xs" />
                                            </div>
                                            <div>
                                                <span className="text-xs text-blue-800 block font-medium">Biaya Tetap Kelas (Gedung/Listrik):</span>
                                                <input type="text" value={formatRp(biayaTetapKelas).replace('Rp', '').trim()} onChange={(e) => setBiayaTetapKelas(parseInt(e.target.value.replace(/\D/g, '')) || 0)} className="w-full bg-white px-3 py-1.5 border border-blue-200 rounded-lg outline-none text-xs" />
                                            </div>
                                            <div className="grid grid-cols-2 gap-2 pt-1">
                                                <div>
                                                    <span className="text-[10px] text-blue-800 block">Sesi KBM:</span>
                                                    <input type="number" value={customKBM} onChange={(e) => setCustomKBM(parseInt(e.target.value) || 0)} className="w-full bg-white px-2 py-1 border border-blue-200 rounded text-xs" />
                                                </div>
                                                <div>
                                                    <span className="text-[10px] text-blue-800 block">Sesi TO:</span>
                                                    <input type="number" value={customTO} onChange={(e) => setCustomTO(parseInt(e.target.value) || 0)} className="w-full bg-white px-2 py-1 border border-blue-200 rounded text-xs" />
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div className="overflow-x-auto border border-gray-200 rounded-2xl shadow-sm">
                                    <table className="w-full text-left border-collapse text-sm">
                                        <thead className="bg-gray-100 text-gray-700">
                                            <tr>
                                                <th className="p-4 border-b">Kelompok Kota</th>
                                                <th className="p-4 border-b">TA 24/25</th>
                                                <th className="p-4 border-b">TA 25/26</th>
                                                <th className="p-4 border-b">TA 26/27</th>
                                                <th className="p-4 border-b bg-blue-50 text-blue-900">Proyeksi TA 27/28</th>
                                                <th className="p-4 border-b bg-emerald-50 text-emerald-900">Nett Income</th>
                                                <th className="p-4 border-b bg-amber-50 text-amber-900">Total Cost (Auto Tarif Max)</th>
                                                <th className="p-4 border-b bg-purple-50 text-purple-900">Profit Margin</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {listKelompokUnik.length === 0 ? <tr><td colSpan="8" className="p-6 text-center text-gray-400">Tidak ada data untuk produk ini.</td></tr> :
                                                listKelompokUnik.map((kel) => {
                                                    const getDataByTA = (ta) => db.find(d => d.produk === selectedProdComp && d.kelompok === kel && d.tahun === ta);
                                                    
                                                    const d24 = getDataByTA("24/25");
                                                    const d25 = getDataByTA("25/26");
                                                    const d26 = getDataByTA("26/27");

                                                    const hargaAcuan = draft27[kel] || (d26 ? d26.harga : 0);
                                                    const grossIncome = hargaAcuan * jumlahSiswa;

                                                    let totalDiskon = 0;
                                                    diskonList.forEach(disc => {
                                                        if (disc.type === '%') totalDiskon += grossIncome * (disc.value / 100);
                                                        else totalDiskon += disc.value * jumlahSiswa;
                                                    });
                                                    const nettIncome = Math.max(0, grossIncome - totalDiskon);

                                                    const maxTarif = getMaxTarifByKelompok(kel);
                                                    const totalCost = (biayaSiswaTotal * jumlahSiswa) + biayaTetapKelas + (customKBM * maxTarif.maxKBM) + (customTO * maxTarif.maxTO);
                                                    
                                                    const grossProfit = nettIncome - totalCost;
                                                    const profitMargin = nettIncome > 0 ? (grossProfit / nettIncome) * 100 : 0;

                                                    return (
                                                        <tr key={kel} className="border-b hover:bg-gray-50">
                                                            <td className="p-4 font-bold text-gray-800">Kelompok {kel}</td>
                                                            <td className="p-4 text-xs text-gray-600">{d24 ? `${formatRp(d24.harga)} / ${d24.kbm}K` : '-'}</td>
                                                            <td className="p-4 text-xs text-gray-600">{d25 ? `${formatRp(d25.harga)} / ${d25.kbm}K` : '-'}</td>
                                                            <td className="p-4 text-xs text-gray-900 font-semibold">{d26 ? `${formatRp(d26.harga)} / ${d26.kbm}K` : '-'}</td>
                                                            <td className="p-4 bg-blue-50/50">
                                                                <input 
                                                                    type="text" 
                                                                    placeholder="Harga baru..." 
                                                                    value={draft27[kel] ? formatRp(draft27[kel]).replace('Rp', '').trim() : ''}
                                                                    onChange={(e) => {
                                                                        const val = parseInt(e.target.value.replace(/\D/g, ''), 10) || 0;
                                                                        setDraft27({...draft27, [kel]: val});
                                                                    }}
                                                                    className="w-full px-3 py-2 bg-white border border-gray-300 rounded-xl outline-none text-sm"
                                                                />
                                                            </td>
                                                            <td className="p-4 bg-emerald-50/40 font-bold text-emerald-700 text-xs">{formatRp(nettIncome)}</td>
                                                            <td className="p-4 bg-amber-50/40 font-semibold text-amber-700 text-xs" title={`Gunakan Tarif KBM Max: ${formatRp(maxTarif.maxKBM)}, TO Max: ${formatRp(maxTarif.maxTO)}`}>
                                                                {formatRp(totalCost)}
                                                            </td>
                                                            <td className="p-4 bg-purple-50/40 font-bold text-purple-700">
                                                                <span className={`px-2 py-1 rounded-lg text-xs ${profitMargin >= 30 ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}`}>
                                                                    {profitMargin.toFixed(1)}%
                                                                </span>
                                                            </td>
                                                        </tr>
                                                    );
                                                })
                                            }
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
